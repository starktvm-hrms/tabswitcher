# Builds the app on every push to main and publishes the build to the `deploy-build`
# branch. The VPS checks that branch every minute and serves the new build at
# https://seminar.starkpeople.in (see deploy/README.md). No secrets needed.
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://seminar.starkpeople.in
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Stamp the build and add the poll server
        run: |
          echo "$GITHUB_SHA" > dist/version.txt
          # The VPS sync job installs .server/ as the poll server (it is not served as part of the site).
          mkdir -p dist/.server
          cp server/poll-core.mjs server/poll-server.mjs dist/.server/

      - name: Publish to the deploy-build branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init -q -b deploy-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy-build

      - name: Wait for the server to publish it
        run: |
          live=""
          for i in $(seq 1 30); do
            live=$(curl -fsSL --max-time 10 https://seminar.starkpeople.in/version.txt 2>/dev/null \
                || curl -fsSL --max-time 10 http://seminar.starkpeople.in/version.txt 2>/dev/null || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "Live at https://seminar.starkpeople.in"
              # The poll server restarts on new code; give it a few seconds, then check it.
              for j in $(seq 1 12); do
                if curl -fsS --max-time 10 https://seminar.starkpeople.in/api/health | grep -q '"ok":true'; then echo "Poll server OK"; exit 0; fi
                sleep 5
              done
              echo "::warning::The site is live, but the poll server isn't answering at /api/health. Run the 'Set up server' workflow."
              exit 0
            fi
            sleep 10
          done
          if [ -z "$live" ] || ! printf '%s' "$live" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::Published, but seminar.starkpeople.in isn't serving builds yet — run the 'Set up server' workflow once."
          else
            echo "::error::The server is still on build $live after 5 minutes. Check 'journalctl -u seminar-sync' on the VPS."
            exit 1
          fi
